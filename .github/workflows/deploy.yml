name: Deploy to VPS

on:
  push:
    branches:
      - main

concurrency:
  group: spyservice-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}

          script: |
            set -e

            cd "${{ secrets.DEPLOY_PATH }}"

            if [ ! -d ".git" ]; then
              git clone https://github.com/Suzven/Idea-Finder.git .
            else
              git fetch origin main
              git reset --hard origin/main
            fi

            pnpm install --frozen-lockfile --store-dir .pnpm-store
            pnpm typecheck
            pnpm test
            pnpm build

            systemctl restart spyservice
            sleep 2
            systemctl is-active --quiet spyservice

            curl --fail --silent --show-error \
              http://127.0.0.1:4100/api/health